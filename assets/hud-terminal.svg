7 { animation: l7 18.0s linear infinite; } @keyframes l8 { 0% { transform: translateX(0); } 49.22% { transform: translateX(0); animation-timing-function: steps(1, end); } 49.28% { transform: translateX(447px); } 100% { transform: translateX(447px); } } .c8 { animation: l8 18.0s linear infinite; } @keyframes pr { 0%, 50.28% { opacity: 0; } 50.38%, 100% { opacity: 1; } } .prompt { animation: pr 18.0s linear infinite; }
